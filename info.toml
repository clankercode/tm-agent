[meta]
name     = "TM Agent"
author   = "XertroV"
category = "Agent"
version  = "0.2.0"

[script]
#__DEFINES__
# tm-mcp-pack-epp is intentionally NOT a hard dependency: pack tools are
# dispatched by name through the TmMcp bus and degrade gracefully (core
# fallbacks) when the pack isn't loaded. A hard dep made every pack reload
# unload tm-agent as a dependent.
dependencies = ["tm-control-mcp", "ai-api", "MLHook"]
export_dependencies = ["MLHook"]

module = "Agent"
timeout = 60000
